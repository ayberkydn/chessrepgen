initial_moves_white:
  - e4
  # - Nf3
initial_moves_black:
  # - ""

time_control:
  - rapid
  - blitz

ratings:
  - 2000
  - 2200
  - 2500

output_file: rep.pgn

min_opponent_popularity: 0.01
advantage_tolerance: 0.012

# How to aggregate outcomes when evaluating move advantages (median or mean)
advantage_aggregation: mean

# Minimum number of Lichess games to continue exploring a position
min_lichess_games: 10000

# Cache settings
cache_file: lichess_cache.db
stockfish_cache_file: stockfish_cache.db

prune_non_best_moves: true

use_proxy: false

# Stockfish evaluation settings
use_stockfish: true
stockfish_path: stockfish
stockfish_depth: 20
stockfish_threads: 8

# Terminal score calculation weights (must sum to 1.0)
terminal_advantage_weight: 0.5
stockfish_score_weight: 0.5
