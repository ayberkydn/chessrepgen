initial_moves_white:
  - e4

initial_moves_black:
  # - ""
time_control:
  - rapid
  - blitz

ratings:
  # - 1600
  # - 1800
  - 2000
  - 2200
  - 2500

output_file: rep.pgn

depth: 5

min_opponent_popularity: 0.01
min_highrating_popularity: 0.005
advantage_tolerance: 0.012

# How to aggregate outcomes when evaluating move advantages (median or mean)
advantage_aggregation: median

# Minimum popularity (relative, 0-1) for a move to be used as baseline for advantage comparison
# This ensures we compare against statistically significant moves, not outliers
min_advantage_baseline_popularity: 0.1

# Minimum number of master games before using high-rating fallback data
min_highrating_games: 10

# Minimum number of Lichess games to continue exploring a position
min_lichess_games: 1000

# Minimum number of Lichess games to keep a move in the final repertoire
postprune_min_lichess_games: 3500

# Whether to fall back to high-rating data when master games are insufficient
highrating_fallback: true

# Cache settings
cache_file: chess_cache.db

# Comment settings
include_comments: true
prune_non_best_moves: true

use_proxy: false
