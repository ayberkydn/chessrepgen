initial_moves_white:
  # - "e4"
  - ""

initial_moves_black:
  # - ""
  #
time_control:
  # - classical
  - rapid
  - blitz

ratings:
  - 1600
  - 1800
  - 2000
  - 2200
  - 2500

depth: 7

min_opponent_popularity: 0.04
first_move_min_opponent_popularity: 0.01

min_highrating_popularity: 0.05

winrate_tolerance: 0.015
first_move_winrate_tolerance: 0.05

# Minimum number of master games before using high-rating fallback data
min_highrating_games: 20

# Minimum number of Lichess games to continue exploring a position
min_lichess_games: 1000

# Output file for the repertoire
output_file: repertoire.pgn

# Cache settings
cache_file: chess_cache.db

# Comment settings
include_comments: true

# Pruning settings
enable_pruning: true

use_proxy: true
