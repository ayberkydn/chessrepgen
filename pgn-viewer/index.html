<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PGN Viewer</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="pgn-viewer">
            <div class="board-container">
                <div class="board-wrapper">
                    <div class="coords coords-ranks"></div>
                    <div class="board" id="board"></div>
                    <div class="coords coords-files"></div>
                </div>
                <div class="comment-panel" id="comment-panel"></div>
                <div class="controls">
                    <button
                        class="control-btn"
                        id="btn-flip"
                        title="Flip board (f)"
                    >
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5.5-2.5l7.51-3.49L17.5 6.5 9.99 9.99 6.5 17.5zm5.5-6.6c.61 0 1.1.49 1.1 1.1s-.49 1.1-1.1 1.1-1.1-.49-1.1-1.1.49-1.1 1.1-1.1z"
                            />
                        </svg>
                    </button>
                    <div class="nav-controls">
                        <button
                            class="control-btn"
                            id="btn-first"
                            title="First move (Home)"
                        >
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M18.41 16.59L13.82 12l4.59-4.59L17 6l-6 6 6 6 1.41-1.41zM6 6h2v12H6V6z"
                                />
                            </svg>
                        </button>
                        <button
                            class="control-btn"
                            id="btn-prev"
                            title="Previous move (←)"
                        >
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12l4.58-4.59z"
                                />
                            </svg>
                        </button>
                        <button
                            class="control-btn"
                            id="btn-next"
                            title="Next move (→)"
                        >
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z"
                                />
                            </svg>
                        </button>
                        <button
                            class="control-btn"
                            id="btn-last"
                            title="Last move (End)"
                        >
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M5.59 7.41L10.18 12l-4.59 4.59L7 18l6-6-6-6-1.41 1.41zM16 6h2v12h-2V6z"
                                />
                            </svg>
                        </button>
                    </div>
                    <button
                        class="control-btn"
                        id="btn-autoplay"
                        title="Autoplay (Space)"
                    >
                        <svg viewBox="0 0 24 24" id="icon-play">
                            <path d="M8 5v14l11-7L8 5z" />
                        </svg>
                        <svg
                            viewBox="0 0 24 24"
                            id="icon-pause"
                            style="display: none"
                        >
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="side-panel">
                <div class="game-info">
                    <div class="players">
                        <div class="player player-top">
                            <span class="player-name" id="player-black"
                                >Black</span
                            >
                            <span
                                class="player-rating"
                                id="rating-black"
                            ></span>
                        </div>
                    </div>
                    <div class="game-meta" id="game-meta"></div>
                </div>
                <div class="moves-container">
                    <div class="moves" id="moves"></div>
                </div>
                <div class="player player-bottom">
                    <span class="player-name" id="player-white">White</span>
                    <span class="player-rating" id="rating-white"></span>
                </div>
                <div class="pgn-input-container">
                    <textarea
                        id="pgn-input"
                        placeholder="Paste PGN here..."
                    ></textarea>
                    <div class="pgn-buttons">
                        <button id="btn-load">Load PGN</button>
                        <label class="file-upload-btn" for="file-input">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"
                                />
                            </svg>
                            Upload File
                        </label>
                        <input
                            type="file"
                            id="file-input"
                            accept=".pgn,.txt"
                            style="display: none"
                        />
                    </div>
                    <div
                        class="game-selector"
                        id="game-selector"
                        style="display: none"
                    >
                        <label for="game-select">Game:</label>
                        <select id="game-select"></select>
                    </div>
                </div>
            </div>
        </div>
        <script src="chess.js"></script>
        <script src="pgn-parser.js"></script>
        <script src="viewer.js"></script>
    </body>
</html>
